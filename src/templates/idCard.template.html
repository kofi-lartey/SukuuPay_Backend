<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sukuupay ID Card</title>
  <style>
    @page { size: A4; margin: 0; }
    body { margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f8; }
    .sheet { width: 210mm; height: 297mm; padding: 10mm; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 5mm; }
    .card { background: #fff; border: 2px solid #1E3A8A; border-radius: 8px; width: calc(50% - 5mm); height: calc(50% - 5mm); padding: 8mm; box-sizing: border-box; position: relative; page-break-inside: avoid; }
    .card-header { text-align: center; margin-bottom: 6mm; }
    .school-logo { width: 40px; height: 40px; object-fit: contain; margin-bottom: 4px; }
    .school-name { font-size: 12pt; font-weight: 700; color: #111827; }
    .divider { border-top: 1px solid #e0e0e0; margin: 6mm 0; }
    .student-photo { width: 32mm; height: 32mm; object-fit: cover; border: 2px solid #e0e0e0; border-radius: 4px; float: left; margin-right: 6mm; }
    .student-info { float: left; width: calc(100% - 40mm); }
    .info-row { font-size: 8pt; color: #374151; margin-bottom: 3px; }
    .info-label { font-weight: 700; }
    .qr-wrapper { position: absolute; bottom: 8mm; right: 8mm; text-align: center; }
    .qr-code { width: 30mm; height: 30mm; }
    .qr-label { font-size: 6pt; color: #6b7280; margin-top: 2px; }
    .stamp { position: absolute; bottom: 8mm; left: 8mm; width: 24px; opacity: 0.15; }
    .card-footer { position: absolute; bottom: 6mm; left: 8mm; right: 8mm; text-align: center; font-size: 6pt; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="sheet">
    <!-- Each card is rendered server-side from the template data -->
    <!-- Example card structure (cloned per student): -->
    <div class="card">
      <div class="card-header">
        <img class="school-logo" src="{{schoolLogo}}" alt="School Logo" />
        <div class="school-name">{{schoolName}}</div>
      </div>
      <div class="divider"></div>
      <img class="student-photo" src="{{studentImage}}" alt="Student Photo" />
      <div class="student-info">
        <div class="info-row"><span class="info-label">Student ID:</span> {{studentId}}</div>
        <div class="info-row"><span class="info-label">Name:</span> {{studentName}}</div>
        <div class="info-row"><span class="info-label">Class:</span> {{studentClass}}</div>
        <div class="info-row"><span class="info-label">Emergency:</span> {{emergencyContact}}</div>
      </div>
      <div class="qr-wrapper">
        <img class="qr-code" src="{{qrCodeUrl}}" alt="QR Pay Link" />
        <div class="qr-label">Scan to pay</div>
      </div>
      <img class="stamp" src="{{schoolStamp}}" alt="Stamp" />
      <div class="card-footer">Sukuupay — Secure school fee collection</div>
    </div>
  </div>
</body>
</html>
